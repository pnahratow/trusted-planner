<!doctype html>
<html lang="en" data-theme="{{ theme | default('system') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Trusted Planner{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/vendor/sortable.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Trusted&nbsp;Planner</a>
    {% block topbar %}{% endblock %}
    <a class="topbar-link" href="/settings">Settings</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>

  {# Filled out-of-band by a delete, emptied by an undo or after a few seconds.
     Hidden by CSS while empty, so it needs no state of its own. #}
  <div id="undo-bar" class="undo-bar"></div>
</body>
</html>
