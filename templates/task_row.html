{# One task. `show_colour` is false on single-member boards, where an identity
   spine would say nothing (D11). #}
<li class="task{% if task.done %} is-done{% endif %}" id="task-{{ task.id }}" data-task-id="{{ task.id }}">
  {% if show_colour %}<span class="spine" style="background: {{ task.colour }}" title="{{ task.author_name }}"></span>{% endif %}

  <form class="task-check"
        hx-post="/task/{{ task.id }}/toggle"
        hx-target="closest .column" hx-swap="outerHTML">
    <button type="submit" class="check" role="checkbox"
            aria-checked="{{ 'true' if task.done else 'false' }}"
            aria-label="{{ 'Mark not done' if task.done else 'Mark done' }}">
      {% if task.done %}&#10003;{% endif %}
    </button>
  </form>

  <button class="task-title" type="button"
          hx-get="/task/{{ task.id }}/edit"
          hx-target="closest .task" hx-swap="outerHTML"
          title="{{ task.notes if task.notes else 'Click to edit' }}">
    {{ task.title }}
    {% if task.notes %}<span class="has-notes" aria-label="has notes">&#9998;</span>{% endif %}
  </button>

  {# No confirmation dialog: it interrupts the common case to guard the rare
     one, and the rare one is covered by the undo bar. #}
  <form class="task-delete"
        hx-post="/task/{{ task.id }}/delete"
        hx-target="closest .column" hx-swap="outerHTML">
    <button type="submit" class="icon-btn" aria-label="Delete task">&times;</button>
  </form>
</li>
