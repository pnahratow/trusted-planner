# Builds the container and pushes it to the GitHub registry: `edge` for the
# branch, and version tags for a release.
name: Image

on:
  push:
    branches: [master, main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image tag, the crate version and the compose file have to agree, or
      # the thing you deploy is not the thing the tag names.
      - name: A release tag must match the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          tag=${GITHUB_REF_NAME#v}
          if [ "$crate" != "$tag" ]; then
            echo "Cargo.toml says $crate but the tag says $tag" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # A version tag also moves `latest`; a branch push is `edge`.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=master
            type=edge,branch=main

      # linux/amd64 only: TrueNAS SCALE is x86_64, and building Rust for arm64
      # under emulation costs far more than it is worth here.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
