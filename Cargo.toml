[package]
name = "trusted-planner"
version = "0.3.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie", "form"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = { version = "0.10.4", features = ["std"] }
futures-core = "0.3.34"
minijinja = { version = "2.24.0", features = ["loader"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Pedantic and nursery are denied deliberately: this is a long-lived,
# low-traffic app that has to keep working unattended on a NAS, so the cost of
# an early warning is much lower than the cost of debugging it there later.
#
# The second group is about panics. A household planner that stops answering is
# worse than one that shows a wrong label at the far end of the calendar, so
# nothing outside a test may unwrap, expect, index, slice, cast or panic: the
# failure has to be handled where it happens or made impossible. Tests are
# exempted in clippy.toml, where a panic is the point.
[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[profile.release]
# A NAS has no use for the symbol table, and it is most of the binary.
strip = true
